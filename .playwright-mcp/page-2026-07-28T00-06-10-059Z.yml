        - heading "SQL the database received" [level=3] [ref=e53]
        - generic [ref=e54]: WITH ranked AS ( SELECT l.listing_id, l.price, l.bed, l.bath, l.city, l.state, l.list_date, (current_date - l.list_date) AS days_on_market, d.title AS document, c.passage, round((1 - (c.embedding <=> $1::halfvec))::numeric, 4) AS similarity, row_number() OVER ( PARTITION BY l.listing_id ORDER BY c.embedding <=> $2::halfvec ) AS rn FROM listings l JOIN chunks c ON c.listing_id = l.listing_id JOIN documents d ON d.document_id = c.document_id WHERE l.status = $3 AND l.price <= $4 AND l.city % $5 ) SELECT listing_id, price, bed, bath, city, state, list_date, days_on_market, document, passage, similarity FROM ranked WHERE rn = 1 ORDER BY similarity DESC LIMIT $6
        - paragraph [ref=e55]: The model chose a tool, not a query. This SQL is ours.
