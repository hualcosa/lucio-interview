[project]
name = "mls-agent"
version = "0.1.0"
description = "Working demo for the MCP architecture review: CSV batch ingest, indexed serving, MCP tools"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "pydantic>=2.9",
    "mcp>=1.2",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mls_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
