# Local dev loop. Iterating against Aurora burns ACU-hours; this is free.
# Same migrations run against both.
services:
  db:
    # pgvector is an extension, not a service — it runs inside this same Postgres
    # process. That is the whole point: filters and vectors share one query plan.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mls
      POSTGRES_PASSWORD: mls
      POSTGRES_DB: mls
    ports:
      - "5433:5432"   # 5433 to avoid colliding with a local postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mls"]
      interval: 2s
      timeout: 3s
      retries: 15
